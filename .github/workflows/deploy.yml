name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The runner's Chrome prints the /cv/ page of the finished site to dist-pdf/; the step fails when the file is
      # not a PDF or is over 600 KB. It runs here only, never on the owner's machine.
      - run: pnpm build:pdf
      # Build again, now that the file exists: the pages link it with its size and the build copies it into dist/.
      - run: pnpm build
      # Every internal link and #fragment of the built pages must resolve; external links are listed, not fetched.
      - run: pnpm check:links
      # The favicon set, the manifest, the share image, the 404 page, the sitemap and the phone rule on the built files.
      - run: pnpm check:assets
      # Read the text of the PDF that will be deployed and compare it with resume.ts (names, roles and dates, the
      # email, no phone number). pdftotext comes with poppler-utils, which is installed here if the image lacks it.
      - run: command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: pnpm test:pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Lighthouse against the dist/ that the build job uploaded, so a failing format check or test never waits for it.
  # Chrome comes with the runner; budgets and URLs are in lighthouserc.json. It runs here only, never on the owner's
  # machine, and the deploy job does not wait for it.
  quality:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages
      - run: mkdir dist && tar -xf pages/artifact.tar -C dist
      - run: pnpm dlx @lhci/cli@0.14.0 autorun
      # The reports are kept whether or not a budget failed. They sit in a hidden folder, which upload-artifact skips
      # unless asked. Nothing leaves GitHub: no third-party service and no token.
      - uses: actions/upload-artifact@v4
        id: lighthouse-report
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
      # Scores of the median run per page, the budgets that failed, and the link to the artefact, in the job summary.
      # A problem here must not hide the result of the budgets, so it never fails the job.
      - run: node scripts/lighthouse-summary.js >> "$GITHUB_STEP_SUMMARY"
        if: always()
        continue-on-error: true
        env:
          REPORT_URL: ${{ steps.lighthouse-report.outputs.artifact-url }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
