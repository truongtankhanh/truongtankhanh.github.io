<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Title, description, canonical, Open Graph and JSON-LD are written per page at build time (src/lib/seo.ts).
         The title below is only what `pnpm dev` shows; the build replaces it. -->
    <title>Trương Tấn Khánh, Full-stack Engineer</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b2447" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f2b57" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!--app-head-->
    <script>
      // Apply the saved theme before first paint, so a dark-mode visitor never sees a light flash.
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
